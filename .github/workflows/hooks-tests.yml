name: Hook Tests

on:
  push:
    branches: [main, development]
    paths:
      - '.claude/hooks/**'
      - '.github/workflows/hooks-tests.yml'
  pull_request:
    paths:
      - '.claude/hooks/**'
      - '.github/workflows/hooks-tests.yml'
  schedule:
    # Weekly on Monday at 6am UTC to catch any regressions
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test-hooks:
    name: Hook Tests (${{ matrix.os }})
    # Skip duplicate runs: only run push events, skip pull_request from same repo
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Bash version
        run: |
          echo "Bash version:"
          bash --version | head -1
          echo "Default /bin/bash version:"
          /bin/bash --version | head -1

      - name: Run hook tests
        run: pnpm vitest run --config .claude/hooks/__tests__/vitest.config.ts --reporter=verbose
        timeout-minutes: 10

# Embed Documentation
#
# Generates embeddings for documentation and uploads to Firestore.
# Manually triggered only for MVP.

name: Embed Documentation

on:
  workflow_dispatch:

jobs:
  embed:
    name: Generate and upload embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate embeddings
        run: pnpm run embed-docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY_CHAT_EMBEDDINGS }}
          GOOGLE_CLOUD_PROJECT: intexuraos-dev

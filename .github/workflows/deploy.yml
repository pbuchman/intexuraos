name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: home-prod
        type: choice
        options:
          - home-prod
          - firestore
          - transcription
          - code-worker

permissions:
  contents: read
  id-token: write
  pull-requests: read
  actions: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy-home-prod:
    name: Deploy Home Production
    if: ${{ inputs.target == 'home-prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      actions: read
      contents: read
      checks: read
      deployments: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROD_SECRET_PACKAGE_VERSION: ${{ vars.PROD_SECRET_PACKAGE_VERSION }}
      HOME_PROD_BROKER_APP_ID: ${{ vars.HOME_PROD_BROKER_APP_ID }}

    steps:
      - name: Prepare exact development release intent
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/development ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROD_SECRET_PACKAGE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$HOME_PROD_BROKER_APP_ID" =~ ^[1-9][0-9]*$ ]]
          api="repos/${GITHUB_REPOSITORY}"
          [[ "$(gh api "$api/git/ref/heads/development" --jq .object.sha)" == "$GITHUB_SHA" ]]
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "$api/contents/config/environments/secret-packages.json?ref=$GITHUB_SHA" |
            jq -e --argjson version "$PROD_SECRET_PACKAGE_VERSION" \
              '.schemaVersion == 1 and .packages.prod.stableVersion == $version' >/dev/null
          gh api "$api/actions/workflows/ci.yml/runs?branch=development&event=push&status=success&head_sha=$GITHUB_SHA" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
              'any(.workflow_runs[]; .head_sha == $sha and .event == "push" and
               .head_branch == "development" and .head_repository.full_name == $repo and
               .status == "completed" and .conclusion == "success")' >/dev/null
      - name: Register Home PROD deployment
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/deployments"
          task="home-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(jq -nc --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{protocol: "home-prod/v2", run_id: $run, run_attempt: $attempt}')"
          lookup() {
            gh api --method GET "$api" -f sha="$GITHUB_SHA" -f task="$task" -f environment=home-prod -f per_page=100 |
              jq -cer --argjson payload "$payload" --arg sha "$GITHUB_SHA" --arg task "$task" '
                [.[] | select(.sha == $sha and .ref == $sha and .environment == "home-prod" and
                  .task == $task and .creator.id == 41898282 and
                  ((.payload | if type == "string" then try fromjson catch null else . end) == $payload)) | .id] |
                if length == 0 then 0 elif length == 1 then .[0] else error("ambiguous deployment") end'
          }
          deployment_id="$(lookup)"
          if [[ "$deployment_id" == 0 ]]; then
            # A transport failure may follow a successful POST. Only repeat the lookup.
            body="$(jq -nc --arg sha "$GITHUB_SHA" --arg task "$task" --argjson payload "$payload" \
              '{ref: $sha, environment: "home-prod", task: $task, payload: $payload, auto_merge: false,
                required_contexts: [], production_environment: true, transient_environment: false}')"
            if ! deployment_id="$(gh api --method POST "$api" --input - --jq '.id' <<< "$body")" ||
               [[ ! "$deployment_id" =~ ^[1-9][0-9]*$ ]]; then
              for delay in 1 2 4 8 16; do
                sleep "$delay"
                deployment_id="$(lookup)" && [[ "$deployment_id" =~ ^[1-9][0-9]*$ ]] && break
              done
            fi
          fi
          [[ "$deployment_id" =~ ^[1-9][0-9]*$ ]]
          printf 'HOME_PROD_DEPLOYMENT_ID=%s\n' "$deployment_id" >> "$GITHUB_ENV"
          printf '%s\n' 'home-prod/v2' "$GITHUB_REPOSITORY" "$GITHUB_REF" \
            "$GITHUB_SHA" "$PROD_SECRET_PACKAGE_VERSION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$deployment_id" > home-prod.intent

      - name: Attest Home PROD release intent
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: home-prod.intent

      - name: Wait for Home PROD activation
        run: |
          set -euo pipefail
          [[ "$HOME_PROD_DEPLOYMENT_ID" =~ ^[1-9][0-9]*$ ]]
          key="home-prod/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${HOME_PROD_DEPLOYMENT_ID}"
          api="repos/${GITHUB_REPOSITORY}"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          while true; do
            if checks="$(gh api --method GET "$api/commits/$GITHUB_SHA/check-runs" \
                -f check_name="$key" -f filter=all -f per_page=100)" &&
               statuses="$(gh api "$api/deployments/$HOME_PROD_DEPLOYMENT_ID/statuses?per_page=100")"; then
              result="$(jq -r --arg key "$key" --arg sha "$GITHUB_SHA" --arg url "$url" \
                --argjson statuses "$statuses" --argjson app "$HOME_PROD_BROKER_APP_ID" '
                [.check_runs[] | select(.name == $key and .external_id == $key and
                  .head_sha == $sha and .app.id == $app and .status == "completed")] as $checks |
                ($checks[0].app.slug // "") as $slug |
                [$statuses[] | select(.log_url == $url and .environment == "home-prod" and
                  (.performed_via_github_app.id == $app or
                   (.performed_via_github_app == null and $slug != "" and
                    .creator.type == "Bot" and .creator.login == ($slug + "[bot]"))))] as $reports |
                if ($checks | length) == 0 or ($reports | length) == 0 then "waiting"
                elif all($checks[]; .conclusion == "success") and all($reports[]; .state == "success")
                then "success" else "failure" end' <<< "$checks")"
              case "$result" in
                success) echo "Home PROD activated and passed health checks."; exit 0 ;;
                failure) echo "::error::Home PROD broker reported an unsuccessful deployment."; exit 1 ;;
              esac
            fi
            sleep 30
          done

  deploy-retained-gcp:
    name: Deploy Retained GCP ${{ inputs.target }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'home-prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Trigger retained Cloud Build target
        id: trigger
        env:
          TARGET: ${{ inputs.target }}
          REGION: europe-central2
        run: |
          set -euo pipefail

          case "$TARGET" in
            firestore|transcription|code-worker) ;;
            *)
              echo "Unsupported retained GCP target: $TARGET" >&2
              exit 1
              ;;
          esac

          BUILD_ID="$(gcloud builds triggers run "$TARGET" \
            --sha="${GITHUB_SHA}" \
            --region="$REGION" \
            --substitutions="COMMIT_SHA=${GITHUB_SHA},BRANCH_NAME=${GITHUB_REF_NAME:-development}" \
            --format="value(metadata.build.id)")"

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered $TARGET build: $BUILD_ID"

      - name: Wait for build completion
        env:
          BUILD_ID: ${{ steps.trigger.outputs.build_id }}
          REGION: europe-central2
        run: |
          set -euo pipefail

          while true; do
            STATUS="$(gcloud builds describe "$BUILD_ID" --region="$REGION" --format="value(status)")"
            echo "Build status: $STATUS"

            case "$STATUS" in
              SUCCESS)
                RESOLVED_COMMIT_SHA="$(gcloud builds describe "$BUILD_ID" \
                  --region="$REGION" \
                  --format="value(sourceProvenance.resolvedGitSource.revision)")"
                if [[ -z "$RESOLVED_COMMIT_SHA" ]]; then
                  RESOLVED_COMMIT_SHA="$(gcloud builds describe "$BUILD_ID" \
                    --region="$REGION" \
                    --format="value(sourceProvenance.resolvedRepoSource.commitSha)")"
                fi
                if [[ "$RESOLVED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
                  echo "Cloud Build provenance SHA mismatch: expected $GITHUB_SHA, resolved ${RESOLVED_COMMIT_SHA:-<empty>}" >&2
                  exit 1
                fi
                exit 0
                ;;
              FAILURE|TIMEOUT|CANCELLED|INTERNAL_ERROR)
                gcloud builds describe "$BUILD_ID" --region="$REGION" --format="value(logUrl)"
                exit 1
                ;;
              QUEUED|WORKING)
                sleep 30
                ;;
              *)
                echo "Unknown build status: $STATUS" >&2
                sleep 30
                ;;
            esac
          done

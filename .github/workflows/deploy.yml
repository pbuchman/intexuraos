name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: home-prod
        type: choice
        options:
          - home-prod
          - firestore
          - transcription
          - code-worker

permissions:
  contents: read
  id-token: write
  pull-requests: read
  actions: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy-home-prod:
    name: Deploy Home Production
    if: ${{ inputs.target == 'home-prod' }}
    runs-on: [self-hosted, Linux, X64, builder]
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      PROD_SECRET_PACKAGE_VERSION: ${{ vars.PROD_SECRET_PACKAGE_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Admit exact development release
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'home-dev' ]] || { echo 'Home PROD requires the home-dev runner' >&2; exit 1; }
          [[ "$GITHUB_REF" == 'refs/heads/development' ]] || { echo 'Home PROD deploys only development' >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA' >&2; exit 1; }
          [[ "$PROD_SECRET_PACKAGE_VERSION" =~ ^[1-9][0-9]*$ ]] || { echo 'PROD_SECRET_PACKAGE_VERSION must be a positive integer' >&2; exit 1; }
          git fetch --quiet --no-tags origin development
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/development)" == "$GITHUB_SHA" ]]
          node scripts/home-prod/verify-secret-package-version-pins.mjs "$PROD_SECRET_PACKAGE_VERSION" config/environments/secret-packages.json

          ci_runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=development&event=push&status=success&head_sha=${GITHUB_SHA}&per_page=100")"
          printf '%s' "$ci_runs" | node -e '
            const fs = require("node:fs");
            const expected = process.argv[1];
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            if (!payload.workflow_runs?.some((run) =>
              run.head_sha === expected && run.head_branch === "development"
              && run.event === "push" && run.conclusion === "success")) process.exit(1);
          ' "$GITHUB_SHA"

      - name: Activate admitted release
        run: sudo /usr/local/sbin/intexuraos-home-prod-deploy "$GITHUB_SHA" "$PROD_SECRET_PACKAGE_VERSION"

  deploy-retained-gcp:
    name: Deploy Retained GCP ${{ inputs.target }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'home-prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Trigger retained Cloud Build target
        id: trigger
        env:
          TARGET: ${{ inputs.target }}
          REGION: europe-central2
        run: |
          set -euo pipefail

          case "$TARGET" in
            firestore|transcription|code-worker) ;;
            *)
              echo "Unsupported retained GCP target: $TARGET" >&2
              exit 1
              ;;
          esac

          BUILD_ID="$(gcloud builds triggers run "$TARGET" \
            --sha="${GITHUB_SHA}" \
            --region="$REGION" \
            --substitutions="COMMIT_SHA=${GITHUB_SHA},BRANCH_NAME=${GITHUB_REF_NAME:-development}" \
            --format="value(metadata.build.id)")"

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered $TARGET build: $BUILD_ID"

      - name: Wait for build completion
        env:
          BUILD_ID: ${{ steps.trigger.outputs.build_id }}
          REGION: europe-central2
        run: |
          set -euo pipefail

          while true; do
            STATUS="$(gcloud builds describe "$BUILD_ID" --region="$REGION" --format="value(status)")"
            echo "Build status: $STATUS"

            case "$STATUS" in
              SUCCESS)
                RESOLVED_COMMIT_SHA="$(gcloud builds describe "$BUILD_ID" \
                  --region="$REGION" \
                  --format="value(sourceProvenance.resolvedGitSource.revision)")"
                if [[ -z "$RESOLVED_COMMIT_SHA" ]]; then
                  RESOLVED_COMMIT_SHA="$(gcloud builds describe "$BUILD_ID" \
                    --region="$REGION" \
                    --format="value(sourceProvenance.resolvedRepoSource.commitSha)")"
                fi
                if [[ "$RESOLVED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
                  echo "Cloud Build provenance SHA mismatch: expected $GITHUB_SHA, resolved ${RESOLVED_COMMIT_SHA:-<empty>}" >&2
                  exit 1
                fi
                exit 0
                ;;
              FAILURE|TIMEOUT|CANCELLED|INTERNAL_ERROR)
                gcloud builds describe "$BUILD_ID" --region="$REGION" --format="value(logUrl)"
                exit 1
                ;;
              QUEUED|WORKING)
                sleep 30
                ;;
              *)
                echo "Unknown build status: $STATUS" >&2
                sleep 30
                ;;
            esac
          done

name: Deploy

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: hetzner-prod
        type: choice
        options:
          - hetzner-prod
          - firestore
          - vm-lifecycle
          - transcription
          - code-worker
      deploy_nginx:
        description: 'Refresh and reload nginx during Hetzner deployment'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'hetzner-prod' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy-hetzner-prod:
    name: Deploy Hetzner Production
    if: ${{ github.event_name == 'push' || inputs.target == 'hetzner-prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      HETZNER_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_PRIVATE_KEY }}
      HETZNER_PROD_HOST: ${{ vars.HETZNER_PROD_HOST || '162.55.210.48' }}
      DEPLOY_NGINX: ${{ github.event_name == 'push' && 'true' || inputs.deploy_nginx }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via Hetzner runtime scripts
        run: bash scripts/hetzner/github-actions-deploy.sh

  deploy-retained-gcp:
    name: Deploy Retained GCP ${{ inputs.target }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'hetzner-prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Trigger retained Cloud Build target
        id: trigger
        env:
          TARGET: ${{ inputs.target }}
          REGION: europe-central2
        run: |
          set -euo pipefail

          case "$TARGET" in
            firestore|vm-lifecycle|transcription|code-worker) ;;
            *)
              echo "Unsupported retained GCP target: $TARGET" >&2
              exit 1
              ;;
          esac

          BUILD_ID="$(gcloud builds triggers run "$TARGET" \
            --sha="${GITHUB_SHA}" \
            --region="$REGION" \
            --substitutions="COMMIT_SHA=${GITHUB_SHA},BRANCH_NAME=${GITHUB_REF_NAME:-development}" \
            --format="value(metadata.build.id)")"

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered $TARGET build: $BUILD_ID"

      - name: Wait for build completion
        env:
          BUILD_ID: ${{ steps.trigger.outputs.build_id }}
          REGION: europe-central2
        run: |
          set -euo pipefail

          while true; do
            STATUS="$(gcloud builds describe "$BUILD_ID" --region="$REGION" --format="value(status)")"
            echo "Build status: $STATUS"

            case "$STATUS" in
              SUCCESS)
                RESOLVED_COMMIT_SHA="$(gcloud builds describe "$BUILD_ID" \
                  --region="$REGION" \
                  --format="value(sourceProvenance.resolvedGitSource.revision)")"
                if [[ -z "$RESOLVED_COMMIT_SHA" ]]; then
                  RESOLVED_COMMIT_SHA="$(gcloud builds describe "$BUILD_ID" \
                    --region="$REGION" \
                    --format="value(sourceProvenance.resolvedRepoSource.commitSha)")"
                fi
                if [[ "$RESOLVED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
                  echo "Cloud Build provenance SHA mismatch: expected $GITHUB_SHA, resolved ${RESOLVED_COMMIT_SHA:-<empty>}" >&2
                  exit 1
                fi
                exit 0
                ;;
              FAILURE|TIMEOUT|CANCELLED|INTERNAL_ERROR)
                gcloud builds describe "$BUILD_ID" --region="$REGION" --format="value(logUrl)"
                exit 1
                ;;
              QUEUED|WORKING)
                sleep 30
                ;;
              *)
                echo "Unknown build status: $STATUS" >&2
                sleep 30
                ;;
            esac
          done

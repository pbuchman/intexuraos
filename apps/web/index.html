<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta property="og:url" content="https://intexuraos.cloud/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://intexuraos.cloud/" />
    <meta name="twitter:title" content="IntexuraOS - AI-Native Platform Where Agents Build the Software" />

    <meta name="twitter:image" content="https://intexuraos.cloud/og-image.png" />

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IntexuraOS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iOS Splash Screens (optional, improves loading experience) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YENMSWBR3X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YENMSWBR3X');
    </script>
  </head>
  <body>
    <!-- Build: __BUILD_SHA__ @ __BUILD_DATE__ -->
    <div
      id="build-info"
      data-sha="__BUILD_SHA__"
      data-date="__BUILD_DATE__"
      style="display: none"
    ></div>
    <div id="root"></div>
    <!-- PWA Share Target redirect for HashRouter compatibility -->
    <script>
      (function () {
        if (window.location.pathname === '/share-target') {
          var search = window.location.search;
          window.location.replace('/#/share-target' + search);
        }
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

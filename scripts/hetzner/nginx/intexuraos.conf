# /etc/nginx/sites-available/intexuraos.conf
# Managed by scripts/hetzner/nginx/intexuraos.conf in the repo (INT-750).
#
# Deploy workflow: copy this file to the VM, run `sudo nginx -t`, then
# `sudo systemctl reload nginx`. Both are in deploy user's sudoers scope.

# ---- Lua shared dicts (for lua-resty-openidc JWKS caching) ------------
# These must be at http-level. `discovery` caches the OpenID Connect
# discovery document (.well-known/openid-configuration). `jwks` caches
# Google's public keys from https://www.googleapis.com/oauth2/v3/certs.
# Both are refreshed per `jwk_expires_in` in scripts/hetzner/nginx/jwt-verify.lua
# (1 hour). Without these, every /internal/* request would re-fetch
# the JWKS from Google — ~100ms added latency per request, plus rate
# limit risk. 1m of shared memory is ~100x what we need.
lua_shared_dict discovery 1m;
lua_shared_dict jwks 1m;

# ---- DNS resolver for Lua HTTP clients --------------------------------
# lua-resty-http (used transitively by lua-resty-openidc to fetch the
# Google OpenID discovery document and JWKS) does runtime DNS resolution
# via nginx's internal resolver. Without this directive, external
# hostname lookups fail with "no resolver defined to resolve X".
# Using Google DNS (8.8.8.8, 8.8.4.4) + Cloudflare (1.1.1.1) for
# redundancy; both are anycast, fast, and DNSSEC-validating.
# ipv6=off because our current setup doesn't have IPv6 network egress
# configured on the VM (the Hetzner firewall allows IPv6 but upstream
# routing isn't tested); flip to `ipv6=on` once we verify egress.
resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 5s;

# ---- CA bundle for Lua HTTPS clients ----------------------------------
# lua-resty-openidc opts.ssl_verify = "yes" (see jwt-verify.lua) makes
# nginx verify the TLS certificate of https://accounts.google.com and
# https://www.googleapis.com. Nginx's Lua HTTP layer uses this CA
# bundle — not the system one — so we point it at Ubuntu's ca-certificates
# bundle explicitly. Without this, HTTPS requests fail with
# "18: self signed certificate in certificate chain" or similar.
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_verify_depth 5;

# ---- WebSocket-aware Connection header -----------------------------------
# Sends "upgrade" only for WebSocket handshakes and "keep-alive" for normal
# HTTP, so keepalive pools on upstreams work correctly for non-WS requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

# ---- Backend upstreams -------------------------------------------------
# Keep the port list in sync with ecosystem.prod.config.cjs. One upstream
# per PM2 service on loopback. `keepalive 16` pools TCP connections so
# nginx doesn't open a fresh TCP handshake on every proxied request.
upstream user_service           { server 127.0.0.1:8110; keepalive 16; }
upstream notion_service         { server 127.0.0.1:8112; keepalive 16; }
upstream whatsapp_service       { server 127.0.0.1:8113; keepalive 16; }
upstream mobile_notif_service   { server 127.0.0.1:8114; keepalive 16; }
upstream research_agent         { server 127.0.0.1:8116; keepalive 16; }
upstream commands_agent         { server 127.0.0.1:8117; keepalive 16; }
upstream actions_agent          { server 127.0.0.1:8118; keepalive 16; }
upstream data_insights_agent    { server 127.0.0.1:8119; keepalive 16; }
upstream image_service          { server 127.0.0.1:8120; keepalive 16; }
upstream notes_agent            { server 127.0.0.1:8121; keepalive 16; }
upstream app_settings_service   { server 127.0.0.1:8122; keepalive 16; }
upstream todos_agent            { server 127.0.0.1:8123; keepalive 16; }
upstream bookmarks_agent        { server 127.0.0.1:8124; keepalive 16; }
upstream calendar_agent         { server 127.0.0.1:8125; keepalive 16; }
upstream linear_agent           { server 127.0.0.1:8126; keepalive 16; }
upstream web_agent              { server 127.0.0.1:8127; keepalive 16; }
upstream code_agent             { server 127.0.0.1:8128; keepalive 16; }
upstream chat_agent             { server 127.0.0.1:8129; keepalive 16; }
upstream cron_agent             { server 127.0.0.1:8130; keepalive 16; }
upstream hellscript_agent       { server 127.0.0.1:8131; keepalive 16; }
upstream llm_usage_service      { server 127.0.0.1:8132; keepalive 16; }

# ---- HTTP → HTTPS redirect --------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name intexuraos.cloud;

    # Leave the HTTP-01 challenge path open as a fallback alongside the
    # DNS-01 path certbot uses by default. Zero cost to leave it in.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS server -----------------------------------------------------
# Note: Ubuntu 24.04 ships nginx 1.24.0, which uses the combined form
# `listen 443 ssl http2 default_server;`. The separated `http2 on;` directive
# was introduced in nginx 1.25 and is not available on 1.24. If the package
# ever upgrades to 1.27+, switch to `listen 443 ssl; http2 on;` to avoid
# deprecation warnings.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name intexuraos.cloud;

    ssl_certificate     /etc/letsencrypt/live/intexuraos.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intexuraos.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy settings shared across all upstream routes
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Pub/Sub push subscriptions can take up to 600s ack deadline
    # (research-process tops out at that). proxy_read_timeout must
    # exceed the largest ack_deadline_seconds in terraform/.../pubsub.tf
    # or nginx will close the connection before the handler responds.
    proxy_read_timeout 610s;
    proxy_send_timeout 610s;
    proxy_connect_timeout 10s;

    # LLM responses can be large
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    client_max_body_size 20m;

    # ---- API routes -------------------------------------------------
    # Trailing slash on both sides strips the location prefix from the
    # upstream path. `/api/user/foo` → `/foo` on the upstream.
    location /api/user/                 { proxy_pass http://user_service/; }
    location /api/notion/               { proxy_pass http://notion_service/; }
    location /api/whatsapp/             { proxy_pass http://whatsapp_service/; }
    location /api/mobile-notifications/ { proxy_pass http://mobile_notif_service/; }
    location /api/research/             { proxy_pass http://research_agent/; }
    location /api/commands/             { proxy_pass http://commands_agent/; }
    location /api/actions/              { proxy_pass http://actions_agent/; }
    location /api/data-insights/        { proxy_pass http://data_insights_agent/; }
    location /api/image/                { proxy_pass http://image_service/; }
    location /api/notes/                { proxy_pass http://notes_agent/; }
    location /api/app-settings/         { proxy_pass http://app_settings_service/; }
    location /api/todos/                { proxy_pass http://todos_agent/; }
    location /api/bookmarks/            { proxy_pass http://bookmarks_agent/; }
    location /api/calendar/             { proxy_pass http://calendar_agent/; }
    location /api/linear/               { proxy_pass http://linear_agent/; }
    location /api/web/                  { proxy_pass http://web_agent/; }
    location /api/code/                 { proxy_pass http://code_agent/; }
    location /api/chat/                 { proxy_pass http://chat_agent/; }
    location /api/cron/                 { proxy_pass http://cron_agent/; }
    location /api/hellscript/           { proxy_pass http://hellscript_agent/; }
    location /api/llm-usage/            { proxy_pass http://llm_usage_service/; }

    # ---- Pub/Sub push endpoints (Google OIDC JWT verified at the edge) ----
    # Replaces Cloud Run's native OIDC verification for subscriptions that
    # push to https://intexuraos.cloud/internal/*. The Lua script enforces:
    #   - Signature via Google JWKS (cached via lua_shared_dict)
    #   - iss = https://accounts.google.com
    #   - aud = https://intexuraos.cloud (matches terraform's oidc_token.audience)
    # On any failure the script terminates with 401 before hitting upstream.
    # After success, the Authorization header is stripped so downstream
    # services see a clean request.
    location /internal/ {
        access_by_lua_file /etc/nginx/lua/jwt-verify.lua;

        # Path-based fan-out to upstreams. These nested location blocks
        # inherit the access_by_lua_file directive from their parent.
        # Order matters only for overlapping prefixes — nginx matches
        # the longest prefix first.
        location ~ ^/internal/whatsapp/   { proxy_pass http://whatsapp_service;  }
        location ~ ^/internal/actions/    { proxy_pass http://actions_agent;     }
        location ~ ^/internal/llm/        { proxy_pass http://research_agent;    }
        location ~ ^/internal/commands/   { proxy_pass http://commands_agent;    }
        location ~ ^/internal/calendar/   { proxy_pass http://calendar_agent;    }
        location ~ ^/internal/bookmarks/  { proxy_pass http://bookmarks_agent;   }
        location ~ ^/internal/todos/      { proxy_pass http://todos_agent;       }

        # No matching prefix → 404 (after successful JWT verification)
        return 404;
    }

    # ---- Web SPA (static files from apps/web/dist) ------------------
    location / {
        root /var/www/intexuraos/web/dist;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /var/www/intexuraos/web/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        root /var/www/intexuraos/web/dist;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---- External health endpoint ----------------------------------
    # For uptime monitors. No auth, no body size, minimal cost.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

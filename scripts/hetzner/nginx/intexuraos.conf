lua_shared_dict discovery 1m;
lua_shared_dict jwks 1m;
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_verify_depth 5;
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

# Query strings carry OAuth codes, webhook verification tokens, and signed media tokens. Keep the
# request path for operations while ensuring those credentials never reach the nginx access log.
log_format intexuraos_no_args '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log intexuraos_no_args;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

upstream user_service { server 127.0.0.1:8110; keepalive 16; }
upstream notion_service { server 127.0.0.1:8112; keepalive 16; }
upstream whatsapp_service { server 127.0.0.1:8113; keepalive 16; }
upstream mobile_notifications_service { server 127.0.0.1:8114; keepalive 16; }
upstream research_agent { server 127.0.0.1:8116; keepalive 16; }
upstream fishing_assistant_service { server 127.0.0.1:8119; keepalive 16; }
upstream image_service { server 127.0.0.1:8120; keepalive 16; }
upstream notes_agent { server 127.0.0.1:8121; keepalive 16; }
upstream app_settings_service { server 127.0.0.1:8122; keepalive 16; }
upstream bookmarks_agent { server 127.0.0.1:8124; keepalive 16; }
upstream calendar_agent { server 127.0.0.1:8125; keepalive 16; }
upstream linear_agent { server 127.0.0.1:8126; keepalive 16; }
upstream web_agent { server 127.0.0.1:8127; keepalive 16; }
upstream code_agent { server 127.0.0.1:8128; keepalive 16; }
upstream hellscript_agent { server 127.0.0.1:8131; keepalive 16; }
upstream llm_usage_service { server 127.0.0.1:8132; keepalive 16; }
upstream api_docs_hub { server 127.0.0.1:8133; keepalive 16; }
upstream intex_agent { server 127.0.0.1:8134; keepalive 16; }
upstream message_digest_service {
    include /etc/nginx/intexuraos-message-digest-upstream.conf;
    keepalive 16;
}

# Local-only maintenance proof surface. It deliberately exposes exactly the
# immutable deployment proof and semantic code-agent health contract.
server {
    listen 127.0.0.1:18080;
    server_name _;
    access_log off;

    location = /deployment.json {
        root /var/www/intexuraos/web/current;
        default_type application/json;
        try_files /deployment.json =404;
        add_header Cache-Control "no-store" always;
    }

    location = /api/code/health {
        proxy_pass http://code_agent/health;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name intexuraos.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://intexuraos.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name intexuraos.cloud;

    ssl_certificate /etc/letsencrypt/live/intexuraos.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intexuraos.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host intexuraos.cloud;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 610s;
    proxy_send_timeout 610s;
    proxy_connect_timeout 10s;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    client_max_body_size 25m;

    set $edge_internal_auth_token "";
    set $edge_internal_caller_role "";
    set $edge_pubsub_from "";
    proxy_set_header X-Internal-Auth $edge_internal_auth_token;
    proxy_set_header X-Internal-Caller-Role $edge_internal_caller_role;
    proxy_set_header From $edge_pubsub_from;

    if ($host != "intexuraos.cloud") {
        return 444;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/code { proxy_pass http://code_agent/; }
    location ^~ /api/code/ { proxy_pass http://code_agent/; }

    location ~ ^/api/[a-z0-9-]+/internal(?:/|$) {
        return 404;
    }

    location = /api/user { proxy_pass http://user_service/; }
    location /api/user/ { proxy_pass http://user_service/; }
    location = /api/whatsapp { proxy_pass http://whatsapp_service/; }
    location /api/whatsapp/ { proxy_pass http://whatsapp_service/; }
    location = /api/notion { proxy_pass http://notion_service/; }
    location /api/notion/ { proxy_pass http://notion_service/; }
    location = /api/notifications { proxy_pass http://mobile_notifications_service/; }
    location /api/notifications/ { proxy_pass http://mobile_notifications_service/; }
    location = /api/fishing-assistant { proxy_pass http://fishing_assistant_service/; }
    location /api/fishing-assistant/ { proxy_pass http://fishing_assistant_service/; }
    location = /api/research { proxy_pass http://research_agent/; }
    location /api/research/ { proxy_pass http://research_agent/; }
    location = /api/notes { proxy_pass http://notes_agent/; }
    location /api/notes/ { proxy_pass http://notes_agent/; }
    location = /api/bookmarks { proxy_pass http://bookmarks_agent/; }
    location /api/bookmarks/ { proxy_pass http://bookmarks_agent/; }
    location = /api/calendar { proxy_pass http://calendar_agent/; }
    location /api/calendar/ { proxy_pass http://calendar_agent/; }
    location = /api/linear { proxy_pass http://linear_agent/; }
    location /api/linear/ { proxy_pass http://linear_agent/; }
    location = /api/images { proxy_pass http://image_service/; }
    location /api/images/ { proxy_pass http://image_service/; }
    location = /api/web { proxy_pass http://web_agent/; }
    location /api/web/ { proxy_pass http://web_agent/; }
    location = /api/settings { proxy_pass http://app_settings_service/; }
    location /api/settings/ { proxy_pass http://app_settings_service/; }
    location = /api/hellscript-agent { proxy_pass http://hellscript_agent/; }
    location /api/hellscript-agent/ { proxy_pass http://hellscript_agent/; }
    location = /api/llm-usage { proxy_pass http://llm_usage_service/; }
    location /api/llm-usage/ { proxy_pass http://llm_usage_service/; }
    location = /api/intex-agent { proxy_pass http://intex_agent/; }
    location /api/intex-agent/ { proxy_pass http://intex_agent/; }
    include /etc/nginx/intexuraos-message-digests-public.conf;

    # api_docs_hub is intentionally local-only for this cutover.
    location /oauth/connections/ { proxy_pass http://user_service; }

    location ^~ /internal/evals/whatsapp/matrix-corpus/ {
        access_log off;
        access_by_lua_file /etc/nginx/lua/jwt-verify.lua;
        proxy_pass http://whatsapp_service/internal/matrix-corpus/;
    }
    location = /internal/evals/whatsapp/whatsapp/private/outbound-matrix-messages {
        access_log off;
        access_by_lua_file /etc/nginx/lua/jwt-verify.lua;
        proxy_pass http://whatsapp_service/internal/whatsapp/private/outbound-matrix-messages;
    }
    location ^~ /internal/evals/intex-agent/matrix-corpus/ {
        access_log off;
        access_by_lua_file /etc/nginx/lua/jwt-verify.lua;
        proxy_pass http://intex_agent/internal/matrix-corpus/;
    }
    location ^~ /internal/evals/intex-agent/test-runs/ {
        access_log off;
        access_by_lua_file /etc/nginx/lua/jwt-verify.lua;
        proxy_pass http://intex_agent/internal/test-runs/;
    }

    location /internal/whatsapp/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://whatsapp_service; }
    location /internal/llm/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://research_agent; }
    location /internal/calendar/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://calendar_agent; }
    location = /internal/bookmarks { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://bookmarks_agent; }
    location /internal/bookmarks/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://bookmarks_agent; }
    location /internal/code/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/code-tasks/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/webhooks/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/logs { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/turn-metrics { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/merge-conflicts/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/merge-queue/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/execution-memory/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/archive-stale-groups { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/auto-archive-merged-tasks { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/linear/issue-context/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/intex-agent/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://intex_agent; }
    location /internal/linear/sync-all { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://linear_agent; }
    location /internal/linear/prune-issues { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://linear_agent; }
    location /internal/notifications/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://mobile_notifications_service; }
    location /internal/message-digests/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://message_digest_service; }
    location /internal/drain-queue { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://code_agent; }
    location /internal/users/ { access_by_lua_file /etc/nginx/lua/jwt-verify.lua; proxy_pass http://user_service; }
    location = /internal {
        access_by_lua_file /etc/nginx/lua/jwt-verify.lua;
        content_by_lua_block {
            ngx.status = ngx.HTTP_NOT_FOUND
            ngx.say("not found")
            return ngx.exit(ngx.HTTP_NOT_FOUND)
        }
    }
    location /internal/ {
        access_by_lua_file /etc/nginx/lua/jwt-verify.lua;
        content_by_lua_block {
            ngx.status = ngx.HTTP_NOT_FOUND
            ngx.say("not found")
            return ngx.exit(ngx.HTTP_NOT_FOUND)
        }
    }

    set $gcs_origin storage.googleapis.com;

    location /share/ {
        rewrite ^/share/(.*)$ /intexuraos-shared-content-dev/$1 break;
        proxy_pass https://$gcs_origin;
        proxy_set_header Host storage.googleapis.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Internal-Auth "";
        proxy_set_header From "";
        proxy_ssl_server_name on;
        expires 1h;
    }

    location /images/ {
        rewrite ^/images/(.*)$ /intexuraos-images-dev/images/$1 break;
        proxy_pass https://$gcs_origin;
        proxy_set_header Host storage.googleapis.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Internal-Auth "";
        proxy_set_header From "";
        proxy_ssl_server_name on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        root /var/www/intexuraos/web/current;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/workbox-[A-Za-z0-9._-]+\.js$ {
        root /var/www/intexuraos/web/current;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
        root /var/www/intexuraos/web/current;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        root /var/www/intexuraos/web/current;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        root /var/www/intexuraos/web/current;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /deployment.json {
        root /var/www/intexuraos/web/current;
        default_type application/json;
        try_files /deployment.json =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root /var/www/intexuraos/web/current;
        try_files $uri $uri/ /index.html;
    }
}

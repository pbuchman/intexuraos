services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    ports:
      - '127.0.0.1:8101:8101'
    volumes:
      - firestore-data:/data
      - ./firestore/start.sh:/start-firestore.sh:ro
    command: sh /start-firestore.sh
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8101/']
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    ports:
      - '8102:8102'
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8102 --project=demo-intexuraos
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8102']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  pubsub-ui:
    build:
      context: ../tools/pubsub-ui
      dockerfile: Dockerfile
    ports:
      - '8105:8105'
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8102
      - PUBSUB_PROJECT_ID=${INTEXURAOS_GCP_PROJECT_ID:-demo-intexuraos}
      - PORT=8105
      - INTEXURAOS_INTERNAL_AUTH_TOKEN=${INTEXURAOS_INTERNAL_AUTH_TOKEN}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      pubsub-emulator:
        condition: service_healthy

volumes:
  firestore-data:
